name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # JOB 1: Run automated tests and save raw results

  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Create .env from template
        run: cp .env.example .env

      - name: Run playwright tests with pytest and generate allure results
        run: xvfb-run pytest -m regression --alluredir=./allure-results --numprocesses=2

      - name: Restore Coverage History
        uses: actions/cache/restore@v4
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run-id }}
          restore-keys: |
            coverage-history-

      - name: Generate coverage report
        run: |
          ui-coverage-tool save-report

      - name: Cache coverage history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}

      # Remove large Playwright attachments BEFORE uploading Allure results
      - name: Remove large attachments
        if: always()
        run: |
          find ./allure-results -type f \( -name "*.zip" -o -name "*.webm" -o -name "*.mp4" \) -delete || true

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 1

      # Upload cleaned Allure results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-artifact
          path: allure-results
          retention-days: 1


  # JOB 2: Download results, generate Allure report and publish to GitHub Pages

  publish-report:
    runs-on: ubuntu-latest

    needs: run-tests

    if: always()

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-artifact
          path: allure-results

      - name: Load Allure History
        run: |
          mkdir -p allure-results
          TEMP_DIR=$(mktemp -d)

          git clone --branch gh-pages --single-branch https://github.com/${{ github.repository }}.git "$TEMP_DIR" || true

          if [ -d "$TEMP_DIR/history" ]; then
            cp -r "$TEMP_DIR/history" ./allure-results/
          fi

      - name: Install Allure CLI and Generate Report
        run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          sudo tar -zxvf allure-2.24.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.24.0/bin/allure /usr/bin/allure

          # Additional protection against large attachments
          if [ -d "allure-results" ]; then
            find ./allure-results -type f \( -name "*.zip" -o -name "*.webm" -o -name "*.mp4" \) -delete || true
          fi

          allure generate ./allure-results --clean -o ./allure-history

      - name: Deploy on GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true